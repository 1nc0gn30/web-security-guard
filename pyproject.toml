[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-guard"
version = "1.0.0"
description = "Zero-dependency web security auditing, strict CSP generator, SRI hasher, WCAG contrast analyzer, and MCP server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Zoth Security Architecture Team", email = "security@zoth.io" }
]
keywords = [
    "security",
    "mcp",
    "mcp-server",
    "csp",
    "sri",
    "wcag",
    "contrast",
    "audit",
    "hardening",
    "devsecops",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sec-guard = "web_security_guard.cli:main"
web-security-guard = "web_security_guard.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/web-security-guard"
Documentation = "https://github.com/1nc0gn30/web-security-guard#readme"
Repository = "https://github.com/1nc0gn30/web-security-guard.git"
Issues = "https://github.com/1nc0gn30/web-security-guard/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
